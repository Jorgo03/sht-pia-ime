<!doctype html>
<html lang="sq" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#FF7A40" />
    <title>Future Home Orange</title>
    <!-- Canonical cascade-layer order. MUST be declared before any stylesheet
         loads (module imports hoist page CSS ahead of tailwind.css), otherwise
         the first @layer block seen would re-order the cascade and preflight
         would override the component CSS. -->
    <style>@layer theme, base, components, utilities;</style>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin="" />
    <!--
      Mobile OAuth relay — deliberately a classic inline script, not a module,
      and placed before the app bundle.

      Expo Go's callback address (exp://<host>:<port>/--/...) cannot be added
      to Supabase's redirect allow-list — verified against the live project,
      including a wildcard. This origin's /auth/callback IS allow-listed and
      Supabase preserves extra query parameters, so the mobile app sends its
      own address along as ?rt= and this page hands the result straight back.

      Why it cannot live in React: ES imports are hoisted, so by the time any
      component runs, src/lib/supabase.js has already been evaluated — and
      that client is configured with detectSessionInUrl + flowType 'pkce', so
      it inspects the URL on construction, finds the ?code=, and tries to
      redeem it. It cannot succeed (the PKCE verifier is on the phone), but it
      touches a single-use code that belongs to the mobile app. Running here,
      before the bundle loads, means the browser leaves for exp:// before the
      Supabase client is ever constructed.

      The scheme check is a security boundary: forwarding to an arbitrary ?rt=
      would be an open redirect, and an open redirect carrying an
      authorization code hands over the account. http/https are excluded on
      purpose — a web target is precisely the case that would leak the code to
      another origin.
    -->
    <script>
      (function () {
        try {
          var params = new URLSearchParams(window.location.search);
          var target = params.get('rt');
          if (!target) return;
          var parsed = new URL(target);
          if (parsed.protocol !== 'exp:' && parsed.protocol !== 'shtepia-ime:') return;
          params.delete('rt');
          params.forEach(function (value, key) { parsed.searchParams.set(key, value); });
          if (window.location.hash && window.location.hash.length > 1) {
            parsed.hash = window.location.hash;
          }
          window.location.replace(parsed.toString());
        } catch (e) {
          /* fall through to the React relay, which renders a tappable link */
        }
      })();
    </script>
    <!--
      Boot guard — the last line of defence against a blank page.

      src/shared/ErrorBoundary.jsx catches render errors, but it can only do
      that once it is mounted, and mounting happens in main.jsx *after* the
      whole import graph has been evaluated. Anything that throws during that
      evaluation — a missing VITE_SUPABASE_* pair, a browser that refuses
      localStorage, a bundle that 404s behind a bad deploy — kills the page
      before React exists. The user gets white nothing, and in production
      there is no console open to explain it.

      So this runs first, as a classic script, and paints a readable panel if
      and only if #root never received anything. It cannot use the app's CSS
      (the failure may be that nothing loaded), so every style is inline.

      Three triggers, because a blank page has three distinct causes:
        - 'error' in the capture phase, which also catches a <script> or
          stylesheet that failed to load, not just thrown exceptions;
        - 'unhandledrejection', for a top-level await or an async boot step;
        - a watchdog, for the case where nothing throws at all and the app
          simply never mounts.
    -->
    <script>
      (function () {
        var painted = false;

        function paint(detail) {
          if (painted) return;
          var root = document.getElementById('root');
          // Never take over a page that rendered. A late async error belongs
          // in the console, not over the top of a working app.
          if (!root || root.childElementCount > 0) return;
          painted = true;

          var dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var ink = dark ? '#F3ECE4' : '#1A1512';
          var soft = dark ? '#A79C90' : '#6E655B';
          var card = dark ? '#1E1A17' : '#FFFFFF';
          var line = dark ? '#332B25' : '#E9E1D7';

          document.body.style.background = dark ? '#14110F' : '#FDFBF8';
          document.body.style.margin = '0';

          root.innerHTML =
            '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;' +
            'font-family:Manrope,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;color:' + ink + '">' +
              '<div style="max-width:460px;background:' + card + ';border:1px solid ' + line + ';' +
              'border-radius:14px;padding:26px 28px">' +
                '<div style="font-size:11px;letter-spacing:.14em;text-transform:uppercase;' +
                'color:#E85D00;font-weight:700;margin-bottom:10px">Shtëpia.ime</div>' +
                '<h1 style="font-size:20px;line-height:1.3;margin:0 0 10px;font-weight:700">' +
                  'The app could not start' +
                '</h1>' +
                '<p style="font-size:14px;line-height:1.6;color:' + soft + ';margin:0 0 16px">' +
                  'Something failed before the page could load. The reason is below — ' +
                  'it is usually missing configuration on the deployment rather than a fault ' +
                  'in the site itself.' +
                '</p>' +
                '<pre style="font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;' +
                'line-height:1.5;background:' + (dark ? '#171310' : '#F6F1EA') + ';border:1px solid ' + line + ';' +
                'border-radius:8px;padding:12px 14px;margin:0 0 18px;white-space:pre-wrap;' +
                'word-break:break-word;color:' + ink + '"></pre>' +
                '<button type="button" style="font:inherit;font-size:14px;font-weight:600;cursor:pointer;' +
                'background:#E85D00;color:#fff;border:none;border-radius:8px;padding:10px 18px">' +
                  'Reload' +
                '</button>' +
              '</div>' +
            '</div>';

          // textContent, not innerHTML: the message can carry a URL or markup
          // from a third-party stack and must never be parsed as HTML here.
          root.querySelector('pre').textContent = detail;
          root.querySelector('button').onclick = function () { window.location.reload(); };
        }

        window.addEventListener('error', function (event) {
          // A failed resource (script/link) reports through event.target and
          // carries no message; a thrown exception carries the message.
          var target = event && event.target;
          if (target && target !== window && (target.src || target.href)) {
            paint('Failed to load ' + (target.src || target.href));
            return;
          }
          paint((event && event.message) || 'Uncaught script error');
        }, true);

        window.addEventListener('unhandledrejection', function (event) {
          var reason = event && event.reason;
          paint((reason && reason.message) || String(reason || 'Unhandled promise rejection'));
        });

        // Nothing threw, nothing 404'd, and still no app. Long enough that a
        // slow phone on a bad connection finishes first.
        window.setTimeout(function () {
          paint('The application did not start within 15 seconds, and reported no error.');
        }, 15000);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
