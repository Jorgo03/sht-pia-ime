<!doctype html>
<!-- Shtëpia.ime — launch video, 1080x1920, 25 s, 30 fps.
     Each scene is its own composition in compositions/; this file only places them.
     Scenes 2→3, 3→4 and 4→5 start on the previous scene's last frame, and 6 overlaps 5
     to fade in, so the hosts below must keep these start times. -->
<html lang="sq" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Newsreader:ital,opsz,wght@0,6..72,500;1,6..72,500&display=block" rel="stylesheet" />
    <link rel="stylesheet" href="assets/film.css" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <script src="assets/film.js"></script>
    <style>
      #root { position: relative; width: 1080px; height: 1920px; background: var(--black); }
      /* Later scenes paint over earlier ones where they overlap. */
      #s1-hook { z-index: 1; } #s2-reveal { z-index: 2; } #s3-discover { z-index: 3; }
      #s4-explore { z-index: 4; } #s5-experience { z-index: 5; } #s6-final { z-index: 6; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="25" data-width="1080" data-height="1920" data-fps="30">
      <div id="host-s1-hook" class="clip" data-composition-id="s1-hook" data-composition-src="compositions/s1-hook.html" data-start="0" data-duration="3.4" data-track-index="0"></div>
      <div id="host-s2-reveal" class="clip" data-composition-id="s2-reveal" data-composition-src="compositions/s2-reveal.html" data-start="3" data-duration="4" data-track-index="1"></div>
      <div id="host-s3-discover" class="clip" data-composition-id="s3-discover" data-composition-src="compositions/s3-discover.html" data-start="7" data-duration="5" data-track-index="2"></div>
      <div id="host-s4-explore" class="clip" data-composition-id="s4-explore" data-composition-src="compositions/s4-explore.html" data-start="12" data-duration="5" data-track-index="3"></div>
      <div id="host-s5-experience" class="clip" data-composition-id="s5-experience" data-composition-src="compositions/s5-experience.html" data-start="17" data-duration="4" data-track-index="4"></div>
      <div id="host-s6-final" class="clip" data-composition-id="s6-final" data-composition-src="compositions/s6-final.html" data-start="20.6" data-duration="4.4" data-track-index="5"></div>
      <div id="vignette" class="vignette clip" data-start="0" data-duration="25" data-track-index="6"></div>
      <!-- Original score, synthesized by audio/score.mjs (hits at 3 s and 21 s, pulse 7–19 s). -->
      <audio id="score" src="assets/audio/score.m4a" data-start="0" data-duration="25" data-volume="1" data-track-index="7"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines['main'] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
